name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore src/NewLife.OllamaHub/NewLife.OllamaHub.csproj

      - name: Build
        run: dotnet build src/NewLife.OllamaHub/NewLife.OllamaHub.csproj -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }}

      - name: Self-test
        run: dotnet run --project src/NewLife.OllamaHub -c Release --no-build --framework net8.0 -- self-test

      - name: Publish single-file (win-x64)
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet publish src/NewLife.OllamaHub/NewLife.OllamaHub.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: NewLife.OllamaHub
          path: publish/NewLife.OllamaHub.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: NewLife.OllamaHub
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NewLife.OllamaHub.exe
          generate_release_notes: true
