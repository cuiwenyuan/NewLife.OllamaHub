name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 双目标（net8.0 + net10.0）需要能识别 net10.0 的 SDK，故 8 / 10 一并安装：
      # net8.0 产物供只装有 .NET 8 运行时的机器使用，net10.0 产物供新环境使用。
      - name: Setup .NET SDKs (8.0 + 10.0)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # 版本号规则对齐 NewLife 全家桶主干库：主.次.年.月日（如 1.3.2026.1113）
      # - tag 触发：版本号完全取自 tag，与 csproj 的日期推导无关，保证「tag == 程序集版本 == 文件名」
      # - 分支/PR 触发：留空，由 csproj 按构建当天日期推导（同一天多次构建幂等）
      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]{4}\.[0-9]{4}$ ]]; then
              echo "::error::tag 必须形如 v主.次.年.月日（例如 v1.3.2026.1113），实际为 ${GITHUB_REF_NAME}"
              exit 1
            fi
            echo "version=$tag" >> "$GITHUB_OUTPUT"
            echo "发布版本：$tag"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "非 tag 构建：版本号由 csproj 按当天日期推导"
          fi

      - name: Restore
        run: dotnet restore src/NewLife.OllamaHub/NewLife.OllamaHub.csproj

      - name: Build (net8.0 + net10.0)
        run: >
          dotnet build src/NewLife.OllamaHub/NewLife.OllamaHub.csproj -c Release --no-restore
          ${{ steps.ver.outputs.version != '' && format('-p:Version={0}', steps.ver.outputs.version) || '' }}

      - name: Self-test (net8.0)
        run: dotnet run --project src/NewLife.OllamaHub -c Release --no-build --framework net8.0 -- self-test

      - name: Self-test (net10.0)
        run: dotnet run --project src/NewLife.OllamaHub -c Release --no-build --framework net10.0 -- self-test

      - name: Publish single-file (net8.0 / win-x64)
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet publish src/NewLife.OllamaHub/NewLife.OllamaHub.csproj
          -c Release -f net8.0 -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:Version=${{ steps.ver.outputs.version }} -o publish/net8.0

      - name: Publish single-file (net10.0 / win-x64)
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet publish src/NewLife.OllamaHub/NewLife.OllamaHub.csproj
          -c Release -f net10.0 -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:Version=${{ steps.ver.outputs.version }} -o publish/net10.0

      # 冒烟校验：产物版本号必须与 tag 完全一致，避免「发出去的文件版本号是构建日期」这类静默偏差
      - name: Verify published version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $expect = "${{ steps.ver.outputs.version }}"
          foreach ($tfm in @('net8.0', 'net10.0')) {
            $exe = "publish/$tfm/NewLife.OllamaHub.exe"
            $fv = (Get-Item $exe).VersionInfo
            Write-Host "$tfm => Assembly=$($fv.FileVersion) Product=$($fv.ProductVersion)"
            if ($fv.FileVersion -ne $expect) {
              throw "[$tfm] FileVersion=$($fv.FileVersion) 与 tag 版本 $expect 不一致"
            }
          }

      # 两份 exe 文件名必须区分，否则 Release 页面无法让用户选择运行时
      - name: Collect artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item publish/net8.0/NewLife.OllamaHub.exe  dist/NewLife.OllamaHub-net8.0.exe
          Copy-Item publish/net10.0/NewLife.OllamaHub.exe dist/NewLife.OllamaHub-net10.0.exe
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: NewLife.OllamaHub
          path: dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: NewLife.OllamaHub
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NewLife.OllamaHub-net8.0.exe
            dist/NewLife.OllamaHub-net10.0.exe
          generate_release_notes: true
